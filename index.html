<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="嘟嘟学习">
<meta name="theme-color" content="#4a5fc1">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>嘟嘟暑假学习工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--text:#2d3142;--sub:#8b8fa3;--blue:#4a5fc1;--green:#4caf50;--red:#f56565;--orange:#ff9800;--purple:#9c27b0;--shadow:0 2px 8px rgba(0,0,0,0.06);--shadow-lg:0 8px 32px rgba(0,0,0,0.12);--radius:12px;--radius-sm:8px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:13px}
.sidebar{width:72px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sidebar-logo{width:40px;height:40px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.sidebar-item{width:100%;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:rgba(255,255,255,0.85);cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;position:relative}
.sidebar-item:hover{background:rgba(255,255,255,0.1)}
.sidebar-item.active{background:rgba(255,255,255,0.18);border-left-color:#fff;color:#fff;font-weight:600}
.sidebar-del{position:absolute;top:0;right:2px;font-size:9px;color:rgba(255,255,255,0.5);width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:0;transition:opacity 0.2s}
.sidebar-edit{position:absolute;top:0;right:16px;font-size:8px;color:rgba(255,255,255,0.5);width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:0;transition:opacity 0.2s}
.sidebar-item:hover .sidebar-del,.sidebar-item:hover .sidebar-edit{opacity:1}
.sidebar-del:hover,.sidebar-edit:hover{background:rgba(255,255,255,0.3);color:#fff}
.sidebar-add{width:40px;height:40px;border-radius:10px;border:2px dashed rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.5);cursor:pointer;margin-top:8px;transition:all 0.2s}
.sidebar-add:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,0.1)}
.sidebar-item .icon{font-size:18px}
.main{margin-left:72px;flex:1;display:flex;flex-direction:column;min-height:100vh;max-height:100vh}
.main.pvz-page{max-height:100vh}
.topbar{height:48px;background:#fff;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #eef0f5;position:sticky;top:0;z-index:40}
.topbar .title{font-size:14px;font-weight:600;flex:1}
.topbar .user{width:30px;height:30px;background:linear-gradient(135deg,#ff9a9e,#fad0c4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px}
.content{flex:1;overflow-y:auto;padding:16px 20px}
.content.pvz-page{padding:0}
.page-title{font-size:18px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.page-subtitle{font-size:11px;color:var(--sub);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:24px;font-weight:700;color:var(--blue);margin-bottom:2px}
.stat-label{font-size:11px;color:var(--sub)}
.stat-card.green .stat-num{color:var(--green)}
.stat-card.orange .stat-num{color:var(--orange)}
.subject-section{background:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.subject-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0f2f5}
.subject-info{display:flex;align-items:center;gap:10px}
.subject-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.icon-yuwen{background:linear-gradient(135deg,#4a5fc1,#6b85d6)}
.icon-shuxue{background:linear-gradient(135deg,#4caf50,#66bb6a)}
.icon-yingyu{background:linear-gradient(135deg,#9c27b0,#ba68c8)}
.icon-docu{background:linear-gradient(135deg,#ff9800,#ffb74d)}
.subject-name{font-size:15px;font-weight:600}
.subject-desc{font-size:11px;color:var(--sub);margin-top:1px}
.subject-actions{display:flex;gap:6px}
.btn-icon{width:28px;height:28px;border:1px solid #eef0f5;background:#fff;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all 0.2s;font-size:14px}
.btn-icon:hover{background:#f5f6fa;color:var(--blue)}
.task-list{list-style:none}
.task-item{display:flex;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:6px;background:#fafbfc;transition:all 0.2s}
.task-item:hover{background:#f0f4ff}
.task-item.done{opacity:0.6}
.task-item.done .task-text{text-decoration:line-through}
.task-check{width:22px;height:22px;border:2px solid #d0d4dd;border-radius:50%;margin-right:10px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-size:12px}
.task-item.done .task-check{background:var(--green);border-color:var(--green);color:#fff}
.task-text{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{font-size:10px;color:var(--sub)}
.task-streak{background:#fff5e6;color:#ff6b00;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:6px;display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.task-actions{display:flex;gap:2px;margin-left:4px}
.task-action{width:20px;height:20px;background:transparent;border:none;cursor:pointer;color:var(--sub);font-size:12px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.task-action:hover{background:#eef0f5;color:var(--red)}
.add-task{display:flex;align-items:center;justify-content:center;padding:7px;border:1.5px dashed #d0d4dd;border-radius:8px;color:var(--sub);cursor:pointer;font-size:11px;transition:all 0.2s;margin-top:2px}
.add-task:hover{border-color:var(--blue);color:var(--blue);background:#f0f4ff}
.docu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.docu-card{background:#fafbfc;border-radius:10px;padding:12px;cursor:pointer;transition:all 0.2s;position:relative;border:1px solid transparent}
.docu-card:hover{background:#fff8e6;border-color:var(--orange);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.docu-thumb{width:100%;height:80px;background:linear-gradient(135deg,#ff9800,#ffb74d);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;color:#fff}
.docu-name{font-size:12px;font-weight:500;margin-bottom:2px}
.docu-meta{font-size:10px;color:var(--sub)}
.docu-delete{position:absolute;top:6px;right:6px;width:18px;height:18px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:10px}
.docu-card:hover .docu-delete{display:flex}
.error-card{background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:10px}
.error-subject{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.error-info{flex:1}
.error-q{font-size:12px;font-weight:500;margin-bottom:2px}
.error-a{font-size:11px;color:var(--green);margin-bottom:1px}
.error-reason{font-size:10px;color:var(--sub);line-height:1.4}
.error-date{font-size:10px;color:var(--sub);margin-top:2px}
.english-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.english-word{font-size:28px;font-weight:700;color:var(--purple);margin-bottom:2px}
.english-phonetic{font-size:12px;color:var(--sub);margin-bottom:8px}
.english-meaning{font-size:13px;margin-bottom:10px;line-height:1.5}
.english-example{background:#fafbfc;padding:8px 12px;border-radius:var(--radius-sm);font-size:11px;line-height:1.6;border-left:3px solid var(--purple)}
.english-nav{display:flex;gap:6px;justify-content:center;margin-top:10px}
.word-list{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{padding:4px 10px;background:#fafbfc;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid #eef0f5;transition:all 0.2s}
.word-chip:hover{background:#f3e5f5;border-color:var(--purple);color:var(--purple)}
.word-chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.plan-card{background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.plan-date{min-width:40px;text-align:center}
.plan-day{font-size:10px;color:var(--sub)}
.plan-dnum{font-size:22px;font-weight:700;color:var(--blue);line-height:1.1}
.plan-detail{flex:1}
.plan-title{font-size:12px;font-weight:600;margin-bottom:2px}
.plan-desc{font-size:11px;color:var(--sub);line-height:1.4}
.chart-section{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.chart-title{font-size:13px;font-weight:600;margin-bottom:10px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week-day{font-size:10px;color:var(--sub);margin-bottom:4px}
.week-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:10px}
.week-dot.done{background:var(--green);color:#fff}
.week-dot.miss{background:#fee;color:var(--red)}
.week-dot.empty{background:#f0f2f5;color:var(--sub)}
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heatmap-cell{aspect-ratio:1;border-radius:3px;background:#f0f2f5}
.heatmap-cell.l1{background:#c8e6c9}.heatmap-cell.l2{background:#81c784}.heatmap-cell.l3{background:#4caf50}.heatmap-cell.l4{background:#2e7d32}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:200}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:18px;width:380px;max-width:90%;box-shadow:var(--shadow-lg);max-height:85vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:12px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid #e0e3e9;border-radius:6px;font-size:13px;font-family:inherit;transition:border-color 0.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--blue)}
.form-group textarea{min-height:60px;resize:vertical}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;transition:all 0.2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#3d51b3}
.btn-secondary{background:#f0f2f5;color:var(--text)}.btn-secondary:hover{background:#e0e3e9}
.btn-danger{background:var(--red);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,0.85);color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;z-index:300;transition:transform 0.3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:24px;bottom:24px;width:44px;height:44px;background:var(--blue);color:#fff;border-radius:50%;border:none;cursor:pointer;font-size:24px;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;z-index:100;transition:all 0.2s}
.fab:hover{transform:scale(1.1)}
.empty{text-align:center;padding:16px;color:var(--sub);font-size:12px}

/* 大卡片 */
.subject-big-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:all 0.2s;position:relative}
.subject-big-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.subject-big-card .sbc-actions{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity 0.2s}
.subject-big-card:hover .sbc-actions{opacity:1}
.sbc-edit,.sbc-del{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:#f0f2f5;transition:all 0.15s}
.sbc-edit:hover{background:#e3f2fd}
.sbc-del{background:#ffebee}.sbc-del:hover{background:#ffcdd2}
.subject-big-card.docu{background:linear-gradient(135deg,#fff8e1,#fff3e0)}
.sbc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sbc-name{font-size:15px;font-weight:700;color:var(--text)}
.sbc-progress{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sbc-bar{flex:1;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden}
.sbc-fill{height:100%;border-radius:3px;transition:width 0.4s}
.subject-big-card:has(.icon-yuwen) .sbc-fill{background:linear-gradient(90deg,#4a5fc1,#6b85d6)}
.subject-big-card:has(.icon-shuxue) .sbc-fill{background:linear-gradient(90deg,#4caf50,#66bb6a)}
.subject-big-card:has(.icon-yingyu) .sbc-fill{background:linear-gradient(90deg,#9c27b0,#ba68c8)}
.subject-big-card.docu .sbc-fill{background:linear-gradient(90deg,#ff9800,#ffb74d)}
.sbc-pct{font-size:11px;font-weight:700;color:var(--sub);min-width:28px}
.sbc-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:6px}
.sbc-preview{display:flex;flex-wrap:wrap;gap:3px}
.sbc-tag{padding:2px 6px;background:#f5f6fa;border-radius:8px;font-size:10px;color:var(--text)}
.sbc-tag.done{background:#e8f5e9;color:#388e3c;text-decoration:line-through}

/* ====== 奖励中心样式 ====== */
.reward-sun-card{background:linear-gradient(135deg,#fff8e1,#fff3e0);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.reward-sun-icon{font-size:36px}
.reward-sun-num{font-size:32px;font-weight:700;color:#5D4037}
.reward-sun-label{font-size:12px;color:var(--sub);margin-left:auto}
.reward-section{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.reward-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.reward-header-left{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.reward-header-icon{font-size:18px}
.reward-count{font-size:11px;color:var(--sub);background:#f0f2f5;padding:2px 8px;border-radius:10px}
.reward-list{display:flex;flex-direction:column;gap:8px}
.reward-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fafbfc;border-radius:10px;transition:all 0.2s;position:relative}
.reward-item:hover{background:#f5f6fa}
.reward-actions{display:flex;gap:2px;margin-right:6px}
.reward-edit,.reward-del{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:#f0f2f5;flex-shrink:0}
.reward-edit:hover{background:#e3f2fd}
.reward-del{background:#ffebee}.reward-del:hover{background:#ffcdd2}
.reward-emoji{font-size:28px;width:40px;text-align:center}
.reward-info{flex:1}
.reward-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.reward-cost{font-size:12px;color:#f57c00;font-weight:700}
.reward-cost .sun-icon{font-size:10px}
.reward-btn{padding:6px 14px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.reward-btn:hover{background:#3d51b3}
.reward-btn.disabled{background:#e0e3e9;color:var(--sub);cursor:not-allowed}
.reward-add-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:10px 24px;background:var(--blue);color:#fff;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);transition:all 0.2s;z-index:50}
.reward-add-bar:hover{background:#3d51b3;transform:translateX(-50%) scale(1.05)}
.reward-add-icon{font-size:18px}

/* ====== PVZ 新样式 ====== */
.pvz-wrap{display:flex;flex-direction:column;gap:10px;padding:16px 20px}
.pvz-top-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pvz-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.pvz-card .pvz-card-icon{font-size:28px;margin-bottom:4px}
.pvz-card .pvz-card-num{font-size:28px;font-weight:700;color:#5D4037}
.pvz-card .pvz-card-label{font-size:11px;color:var(--sub);margin-top:2px}
.pvz-card.sun{background:linear-gradient(135deg,#fff8e1,#fff3e0)}
.pvz-card.streak{background:linear-gradient(135deg,#ffebee,#fce4ec)}
.pvz-card.streak .pvz-card-num{color:var(--red)}
.pvz-garden{background:linear-gradient(180deg,#81c784 0%,#66bb6a 100%);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pvz-garden-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px}
.pvz-garden-header .left,.pvz-garden-header .right{display:flex;align-items:center;gap:4px;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.pvz-grid{display:grid;grid-template-columns:40px repeat(7,1fr) 40px;gap:4px}
.pvz-grid-row{display:contents}
.pvz-grid-base{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pvz-grid-base .base-icon{font-size:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3))}
.pvz-grid-base .base-label{font-size:8px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.3);text-align:center;line-height:1}
.pvz-grid-cell{background:rgba(255,255,255,0.25);border-radius:6px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;position:relative;cursor:pointer;transition:all 0.2s;border:1.5px dashed rgba(255,255,255,0.4);font-size:20px}
.pvz-grid-cell:hover{background:rgba(255,255,255,0.4);border-color:#FFD54F}
.pvz-grid-cell.has-plant{background:rgba(255,255,255,0.45);border-style:solid;border-color:rgba(255,255,255,0.5);animation:plantBounce 2.5s ease-in-out infinite;cursor:default}
.pvz-grid-cell.has-plant:hover{transform:scale(1.1);animation:none}
.pvz-grid-cell .plant-label{position:absolute;bottom:1px;font-size:7px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,0.5);white-space:nowrap}
.pvz-grid-zombie{display:flex;align-items:center;justify-content:center;position:relative}
.pvz-grid-zombie .zombie-icon{font-size:24px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4));animation:zombieRage 0.5s ease-in-out infinite}
.pvz-grid-zombie .zombie-label{position:absolute;top:-10px;font-size:8px;background:rgba(244,67,54,0.9);color:#fff;padding:0 3px;border-radius:4px;white-space:nowrap;font-weight:700}
.pvz-grid-zombie.frozen .zombie-icon{opacity:0.5;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4)) brightness(1.4) saturate(0.3)}
.pvz-garden-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:0 4px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.pvz-garden-footer .total{font-weight:700}
.pvz-energy-section{background:#fff;border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}

function load(){
  try{
    const r=localStorage.getItem(K);
    if(r){
      const data=JSON.parse(r);
      if(!data.visions) data.visions=def.visions;
      if(!data.visionNextId) data.visionNextId=def.visionNextId;
      if(!data.subjectOrder) data.subjectOrder=Object.keys(data.subjects);
      if(!data.subjectNextId) data.subjectNextId=11;
      if(!data.sidebarItems) data.sidebarItems=def.sidebarItems;
      if(!data.sidebarNextId) data.sidebarNextId=def.sidebarNextId;
      if(!data.rewards) data.rewards=def.rewards;
      if(!data.rewardNextId) data.rewardNextId=def.rewardNextId;
      return data;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(def));
}
function save(){localStorage.setItem(K,JSON.stringify(S));}
let S=load();
let nid=500,curPage='workbench',curSubject=null,editErrId=null,editPlanId=null,editingTaskId=null,currentSubject='yuwen';
const pageTitles={workbench:'嘟嘟暑假学习工作台',errorbook:'错题本',reward:'奖励中心',pvz:'植物大战',vision:'视力训练',stats:'打卡统计',english:'每日英语',plan:'近期计划',docu:'纪录片'};

// ========== 渲染 ==========
function renderSidebar(){
  const nav=S.sidebarItems.map(item=>{
    const active=curPage===item.id?' active':'';
    return `<div class="sidebar-item${active}" data-page="${item.id}" data-action="nav">
      <span class="icon">${item.icon}</span><span>${item.name}</span>
      <span class="sidebar-edit" data-action="edit" data-id="${item.id}">✎</span>
      <span class="sidebar-del" data-action="del" data-id="${item.id}">×</span>
    </div>`;
  }).join('');
  document.getElementById('sidebarNav').innerHTML=nav+`<div class="sidebar-add" data-action="add">+</div>`;
  // 事件委托
  document.getElementById('sidebarNav').onclick=function(e){
    const el=e.target.closest('[data-action]');
    if(!el)return;
    const action=el.dataset.action;
    if(action==='nav'){navTo(el.closest('.sidebar-item').dataset.page);}
    else if(action==='edit'){e.stopPropagation();editSidebarItem(el.dataset.id);}
    else if(action==='del'){e.stopPropagation();delSidebarItem(el.dataset.id);}
    else if(action==='add'){addSidebarItem();}
  };
}

function navTo(page){
  curPage=page;curSubject=null;render();
}

function addSidebarItem(){
  const icon=prompt('图标 emoji','📌')||'📌';
  const name=prompt('导航名称','新页面')||'新页面';
  const id='s'+S.sidebarNextId++;
  S.sidebarItems.push({id,icon,name,builtin:false});
  save();render();toast('已添加「'+name+'」');
}

function editSidebarItem(id){
  const item=S.sidebarItems.find(x=>x.id===id);if(!item)return;
  item.icon=prompt('图标 emoji',item.icon)||item.icon;
  item.name=prompt('导航名称',item.name)||item.name;
  save();render();toast('已修改');
}

function delSidebarItem(id){
  const item=S.sidebarItems.find(x=>x.id===id);
  if(!item||!confirm('确定删除「'+item.name+'」？'))return;
  S.sidebarItems=S.sidebarItems.filter(x=>x.id!==id);
  if(curPage===id)curPage='workbench';
  save();render();toast('已删除');
}

function render(p){
  curPage=p||curPage;
  if(curPage==='workbench'&&curSubject&&S.subjects[curSubject]){
    document.getElementById('topTitle').textContent=S.subjects[curSubject].name+' - 任务详情';
  }else{
    document.getElementById('topTitle').textContent=pageTitles[curPage]||'嘟嘟学习';
  }
  let h='';
  switch(curPage){
    case 'workbench':h=renderWorkbench();break;
    case 'errorbook':h=renderErrorbook();break;
    case 'reward':h=renderReward();break;
    case 'pvz':h=renderPVZ();break;
    case 'vision':h=renderVision();break;
    case 'stats':h=renderStats();break;
    case 'english':h=renderEnglish();break;
    case 'plan':h=renderPlan();break;
    case 'docu':h=renderDocuPage();break;
    default:h='<div class="page-title">📌 自定义页面</div><div class="page-subtitle">这是你添加的自定义页面，可以自由使用</div>';
  }
  document.getElementById('content').innerHTML=h;
  document.getElementById('content').classList.toggle('pvz-page',curPage==='pvz');
  document.querySelector('.main').classList.toggle('pvz-page',curPage==='pvz');
  renderSidebar();
  if(curPage==='pvz'){initPVZ();}
}

// ====== 工作台 ======
function renderWorkbench(){
  if(curSubject)return renderSubjectDetail(curSubject);
  const all=[];
  S.subjectOrder.forEach(k=>{if(S.subjects[k]) all.push(...S.subjects[k].tasks);});
  const t=all.length,d=all.filter(x=>x.done).length,r=t>0?Math.round(d/t*100):0;
  const cards=S.subjectOrder.map(k=>{
    if(!S.subjects[k])return '';
    const s=S.subjects[k];
    const done=s.tasks.filter(x=>x.done).length;
    const total=s.tasks.length;
    const pct=total>0?Math.round(done/total*100):0;
    return `<div class="subject-big-card" onclick="curSubject='${k}';render()">

      <div class="sbc-stats"><span>${done}/${total} 项完成</span><span>共 ${total} 项</span></div>
      <div class="sbc-preview">${s.tasks.slice(0,3).map(t=>`<span class="sbc-tag${t.done?' done':''}">${t.done?'✓':''}${esc(t.text).substring(0,10)}${t.text.length>10?'…':''}</span>`).join('')}</div>

  </div>`;
  return `<div class="page-title">🌱 嘟嘟暑假学习工作台</div><div class="page-subtitle">${getDateStr()}·加油鸭！</div>
    <div class="stats"><div class="stat-card"><div class="stat-num">${t}</div><div class="stat-label">学习项</div></div>

function addSubject(){

function delSubject(k){

}

// ====== PVZ 战场 ======
function renderPVZ(){
  const p=S.pvz;
  const lanes=[
    {k:'yuwen',n:'语文',icon:'📖',zEmoji:'🧟',zName:'读报僵尸'},
    {k:'shuxue',n:'数学',icon:'🔢',zEmoji:'🧟‍♂️',zName:'路障僵尸'},
    {k:'yingyu',n:'英语',icon:'🔤',zEmoji:'🧟‍♀️',zName:'舞王僵尸'}
  ];

  // 计算连续天数
  const allDone=Object.values(S.subjects).every(sub=>sub.tasks.every(t=>t.done));
  if(allDone)p.streakDays=(p.streakDays||0)+1;

  // 花园网格
  let gridRows='';
  lanes.forEach((lane,i)=>{
    const z=p.zombies.find(x=>x.lane===lane.k);
    const pos=z?z.position:0;
    const lanePlants=p.plants.filter(x=>x.row===i);

    // 基地列
    const basePlants=lanePlants.filter(x=>x.col===0);
    const basePlant=basePlants[0];
    const baseContent=basePlant?(()=>{
      const pd=PLANT_DEFS.find(x=>x.type===basePlant.type);
      return `<div class="base-icon">${pd?pd.emoji:'🌱'}</div><div class="base-label">${pd?pd.name:''}</div>`;
    })():`<div class="base-icon">🏠</div><div class="base-label">基地</div>`;

    // 植物列（1-7）
    let cells='';
    for(let c=1;c<=7;c++){
      const plant=lanePlants.find(x=>x.col===c);
      if(plant){
        const pd=PLANT_DEFS.find(x=>x.type===plant.type);
        cells+=`<div class="pvz-grid-cell has-plant" onclick="showPlantDetail('${plant.type}')">${pd?pd.emoji:'🌱'}${pd?`<div class="plant-label">${pd.name}</div>`:''}</div>`;
      }else{
        cells+=`<div class="pvz-grid-cell" onclick="onCellClick(${i},${c})">+</div>`;
      }
    }

    // 僵尸列
    const zombieHtml=z?`<div class="pvz-grid-zombie${z.frozen?' frozen':''}"><span class="zombie-icon">${z.emoji}</span><span class="zombie-label">${pos>=7?'⚠️危险':pos+'/'+8}</span></div>`:'';

    gridRows+=`<div class="pvz-grid-row">
      <div class="pvz-grid-base">${baseContent}</div>
      ${cells}
      <div class="pvz-grid-zombie">${zombieHtml}</div>
    </div>`;
  });

  // 今日能量明细
  let energyRows='',todayTotal=0;
  S.subjectOrder.forEach(k=>{
    const sub=S.subjects[k];
    const doneCount=sub.tasks.filter(t=>t.done).length;
    if(doneCount>0){
      const earn=doneCount*50;todayTotal+=earn;
      energyRows+=`<div class="pvz-energy-row"><span class="name">${sub.icon} ${sub.name} · 完成${doneCount}项</span><span class="val">+${earn}☀️</span></div>`;
      sub.tasks.filter(t=>t.done&&t.streak>=3).forEach(t=>{
        todayTotal+=10;
        energyRows+=`<div class="pvz-energy-row"><span class="name">🔥 ${sub.name} · 连续${t.streak}天</span><span class="val">+10☀️</span></div>`;
      });
    }
  });
  p.plants.forEach(pl=>{
    const pd=PLANT_DEFS.find(x=>x.type===pl.type);
    if(pd&&pd.effect==='daily_sun'){todayTotal+=pd.effectVal;energyRows+=`<div class="pvz-energy-row"><span class="name">${pd.emoji} ${pd.name}产出</span><span class="val">+${pd.effectVal}☀️</span></div>`;}
  });
  if(!energyRows)energyRows='<div class="pvz-energy-row"><span class="name">今天还没有完成学习任务哦</span><span class="val">0☀️</span></div>';

  return `<div class="pvz-wrap">
    <div class="pvz-top-cards">
      <div class="pvz-card sun">
        <div class="pvz-card-icon">☀️</div>
        <div class="pvz-card-num">${p.sun}</div>
        <div class="pvz-card-label">阳光</div>
      </div>
      <div class="pvz-card streak">
        <div class="pvz-card-icon">🔥</div>
        <div class="pvz-card-num">${p.streakDays}</div>
        <div class="pvz-card-label">连续天数</div>
      </div>
    </div>
    <div class="pvz-garden">
      <div class="pvz-garden-header">
        <div class="left">🏠 嘟嘟的花园基地</div>
        <div class="right">🌿 三路僵尸待命中，继续保持！</div>
      </div>
      <div class="pvz-grid">${gridRows}</div>
      <div class="pvz-garden-footer">
        <span class="hint">👆 点空格选植物种下，点植物收回仓库</span>
        <span class="total">${p.sun}</span>
      </div>
    </div>
    <div class="pvz-energy-section">
      <div class="pvz-energy-title">⚡ 今日能量 <span class="add-btn" onclick="openShop()">+</span></div>
      <div class="pvz-energy-list">${energyRows}</div>
      <div class="pvz-energy-total"><span class="total-label">📊 合计</span><span class="total-val">+${todayTotal}☀️</span></div>
    </div>
  </div>`;
}

function initPVZ(){
  if(!S.pvz.todayChecked||S.pvz.lastCheckDate!==new Date().toISOString().slice(0,10)){
    S.pvz.todayChecked=true;
    S.pvz.lastCheckDate=new Date().toISOString().slice(0,10);
    save();
    setTimeout(()=>toast('🧟 僵尸正在靠近！完成学习任务击退它们！'),500);
  }
}

function openShop(){
  const p=S.pvz;
  const totalDone=Object.values(S.subjects).reduce((s,sub)=>s+sub.tasks.filter(t=>t.done).length,0);
  let shop='';
  PLANT_DEFS.forEach(pl=>{
    const owned=p.plants.some(x=>x.type===pl.type);
    const locked=!owned&&totalDone<pl.unlock;
    shop+=`<div class="pvz-shop-item${locked?' locked':''}${owned?' owned':''}" onclick="${locked?'':owned?'showPlantDetail(\''+pl.type+'\')':'buyPlant(\''+pl.type+'\')'}">
      <div class="pvz-shop-emoji">${pl.emoji}</div>
      <div class="pvz-shop-name">${pl.name}${owned?'✓':''}</div>
      <div class="pvz-shop-desc">${pl.desc}</div>
      <div class="pvz-shop-cost">${locked?`🔒需${pl.unlock}任务`:owned?'已拥有':`☀️${pl.cost}`}</div>
    </div>`;
  });
  document.getElementById('shopContent').innerHTML=shop;
  document.getElementById('shopModal').classList.add('show');
}

function onCellClick(row,col){
  const p=S.pvz;
  if(p.plants.some(x=>x.row===row&&x.col===col)){toast('这里已经有植物了！');return;}
  const owned=[...new Set(p.plants.map(x=>x.type))];
  if(owned.length===0){toast('还没有植物！先打开商店购买吧~');openShop();return;}
  const unplanted=PLANT_DEFS.filter(d=>owned.includes(d.type)&&!p.plants.some(x=>x.type===d.type&&x.row===row));
  const allOwned=PLANT_DEFS.filter(d=>owned.includes(d.type));
  if(unplanted.length===0&&allOwned.length>0){toast('所有植物都已种下啦！');return;}
  const plantType=unplanted.length>0?unplanted[0].type:allOwned[0].type;
  p.plants.push({type:plantType,row,col,planted:new Date().toISOString().slice(0,10)});
  save();render('reward');
  const pd=PLANT_DEFS.find(x=>x.type===plantType);
  toast(`🌱种下了${pd?pd.name:'植物'}！`);
}

function buyPlant(type){
  const pd=PLANT_DEFS.find(x=>x.type===type);
  if(!pd)return;
  const p=S.pvz;
  if(p.plants.some(x=>x.type===type)){toast('已经拥有这个植物了！');return;}
  const totalDone=Object.values(S.subjects).reduce((s,sub)=>s+sub.tasks.filter(t=>t.done).length,0);
  if(totalDone<pd.unlock){toast(`🔒需要完成${pd.unlock}个任务才能解锁！`);return;}
  if(p.sun<pd.cost){toast(`☀️阳光不足！需要${pd.cost}，当前${p.sun}`);return;}
  p.sun-=pd.cost;
  let planted=false;
  for(let r=0;r<3;r++){
    for(let c=1;c<=7;c++){
      if(!p.plants.some(x=>x.row===r&&x.col===c)){
        p.plants.push({type,row:r,col:c,planted:new Date().toISOString().slice(0,10)});
        planted=true;break;
      }
    }
    if(planted)break;
  }
  if(!planted)p.plants.push({type,row:0,col:1,planted:new Date().toISOString().slice(0,10)});
  save();render('reward');closeModal('shopModal');
  toast(`🎉购买了${pd.name}！${pd.emoji}`);
}

function showPlantDetail(type){
  const pd=PLANT_DEFS.find(x=>x.type===type);
  if(!pd)return;
  document.getElementById('plantDetailEmoji').textContent=pd.emoji;
  document.getElementById('plantDetailName').textContent=pd.name;
  document.getElementById('plantDetailDesc').textContent=pd.desc+'·购买价格：☀️'+pd.cost;
  document.getElementById('plantDetailModal').classList.add('show');
}

// ====== 僵尸位置更新 ======
function updateZombies(){
  const p=S.pvz;
  const laneMap={yuwen:0,shuxue:1,yingyu:2};
  Object.entries(S.subjects).forEach(([k,sub])=>{
    const z=p.zombies.find(x=>x.lane===k);
    if(!z)return;
    if(z.frozen){z.frozen=false;return;}
    const total=sub.tasks.length;
    const done=sub.tasks.filter(t=>t.done).length;
    if(done===total){
      z.position=Math.max(0,z.position-1);
      const row=laneMap[k];
      const lanePlants=p.plants.filter(x=>x.row===row);
      if(lanePlants.some(x=>x.type==='peashooter'))z.position=Math.max(0,z.position-1);
      if(lanePlants.some(x=>x.type==='cherryBomb'))z.position=Math.max(0,z.position-3);
    }else if(done===0){
      z.position=Math.min(8,z.position+1);
    }
    if(z.position>=8){
      const row=laneMap[k];
      const lanePlants=p.plants.filter(x=>x.row===row);
      if(lanePlants.some(x=>x.type==='wallnut')){
        const wnIdx=p.plants.findIndex(x=>x.row===row&&x.type==='wallnut');
        if(wnIdx>=0){p.plants.splice(wnIdx,1);toast('🥔坚果墙牺牲了，但保护了基地！');}
        z.position=5;
      }else if(p.baseHealth>0){
        if(lanePlants.length>0){
          const eaten=p.plants.findIndex(x=>x.row===row);
          if(eaten>=0){p.plants.splice(eaten,1);toast('🧟僵尸吃掉了你的植物！');}
        }else{
          p.baseHealth--;
          toast(`💔僵尸入侵基地！基地血量-1（剩余${p.baseHealth}）`);
        }
        z.position=5;
      }
      if(p.baseHealth<=0){toast('🏚️基地被攻破了...快完成任务重建防线吧！');p.baseHealth=1;}
    }
  });
  save();
}

function dailyPVZCheck(){
  const p=S.pvz;
  const today=new Date().toISOString().slice(0,10);
  if(p.lastCheckDate===today)return;
  p.lastCheckDate=today;
  p.plants.forEach(pl=>{
    const pd=PLANT_DEFS.find(x=>x.type===pl.type);
    if(pd&&pd.effect==='daily_sun')p.sun+=pd.effectVal;
  });
  if(p.plants.some(x=>x.type==='kernelpult')){
    if(Math.random()<0.3){p.coins+=1;toast('🌽玉米投手发现了1枚金币！');}
  }
  save();
}

// ====== 任务操作 ======
function toggleTask(id,k){
  const t=S.subjects[k].tasks.find(x=>x.id===id);
  if(t){
    t.done=!t.done;
    if(t.done){t.streak=(t.streak||0)+1;S.pvz.sun+=50;toast('🎉完成任务+50☀️');}
    else{t.streak=Math.max(0,(t.streak||0)-1);S.pvz.sun=Math.max(0,S.pvz.sun-50);toast('已取消完成');}
    if(t.done&&t.streak>0&&t.streak%3===0){S.pvz.sun+=10;S.pvz.coins+=1;toast('🔥连续奖励+10☀️+1🪙');}
    updateZombies();save();render();
  }
}

}

document.getElementById('modalSaveBtn').onclick=function(){

// ====== 视力训练 ======
function renderVision(){
  const cards=S.visions.map(v=>{
    const min=Math.floor(v.duration/60),sec=v.duration%60;
    const durStr=min>0?sec>0?`${min}分${sec}秒`:`${min}分钟`: `${sec}秒`;
    return `<div class="vision-card" onclick="startVision(${v.id})">
      <div class="vision-card-actions">
        <span class="vision-edit" onclick="event.stopPropagation();editVision(${v.id})">✏️</span>
        <span class="vision-del" onclick="event.stopPropagation();delVision(${v.id})">🗑️</span>
      </div>
      <div class="vision-icon">${v.icon}</div>
      <div class="vision-name">${v.name}</div>
      <div class="vision-desc">${v.desc}</div>
      <div class="vision-time">⏱ ${durStr}</div>
    </div>`;
  }).join('');
  return `<div class="page-title">👁️视力训练</div>
    <div class="page-subtitle">每天5分钟，保护眼睛，放松视力</div>
    <div class="vision-grid">${cards}</div>
    <div class="add-task" onclick="addVision()">+添加训练</div>
    <div id="vision-timer" class="vision-timer" style="display:none"></div>`;
}

function addVision(){
  const icon=prompt('输入图标 emoji（如 🔭👀💆🧊）','👁️')||'👁️';
  const name=prompt('训练名称','新训练')||'新训练';
  const desc=prompt('简短描述','');
  const min=parseInt(prompt('时长（分钟）','5'))||5;
  const sec=parseInt(prompt('时长（秒，0表示没有）','0'))||0;
  S.visions.push({id:S.visionNextId++,icon,name,desc,duration:min*60+sec});
  save();render();toast('已添加');
}

function editVision(id){
  const v=S.visions.find(x=>x.id===id);if(!v)return;
  v.icon=prompt('图标 emoji',v.icon)||v.icon;
  v.name=prompt('训练名称',v.name)||v.name;
  v.desc=prompt('简短描述',v.desc)||'';
  const min=Math.floor(v.duration/60),sec=v.duration%60;
  const newMin=parseInt(prompt('时长（分钟）',min))||0;
  const newSec=parseInt(prompt('时长（秒）',sec))||0;
  v.duration=Math.max(1,newMin*60+newSec);
  save();render();toast('已修改');
}

function delVision(id){
  if(!confirm('确定删除这个训练？'))return;
  S.visions=S.visions.filter(x=>x.id!==id);
  save();render();toast('已删除');
}

function startVision(id){
  const v=S.visions.find(x=>x.id===id);if(!v)return;
  let t=v.duration;
  const timerEl=document.getElementById('vision-timer');
  timerEl.style.display='block';
  timerEl.innerHTML=`<div class="vision-active">
    <div class="vision-active-icon">${v.icon}</div>
    <div class="vision-active-name">${v.name}</div>
    <div class="vision-active-inst">${v.desc}</div>
    <div class="vision-countdown">⏱ <span id="vision-count">${t}</span>秒</div>
    <button class="vision-cancel" onclick="stopVision()">取消</button>
  </div>`;
  const countEl=document.getElementById('vision-count');
  const iv=setInterval(()=>{
    t--;
    countEl.textContent=t;
    if(t<=0){clearInterval(iv);timerEl.innerHTML=`<div class="vision-active"><div class="vision-active-icon">✅</div><div class="vision-active-name">完成！</div><div class="vision-active-desc">太棒了！眼睛得到了放松 🎉</div><button class="vision-done" onclick="document.getElementById('vision-timer').style.display='none'">返回</button></div>`;toast('视力训练完成！+30☀️');S.pvz.sun+=30;save();updateTopBar();}
  },1000);
  timerEl._interval=iv;
}
function stopVision(){clearInterval(document.getElementById('vision-timer')._interval);document.getElementById('vision-timer').style.display='none';}

// ====== 打卡统计 ======
function renderStats(){
  const all=[];
  S.subjectOrder.forEach(k=>{if(S.subjects[k])all.push(...S.subjects[k].tasks);});
  const done=all.filter(t=>t.done).length,total=all.length,rate=total>0?Math.round(done/total*100):0;
  const week=['一','二','三','四','五','六','日'];const wd=[3,2,4,3,5,done,0];
  let wHtml=week.map((d,i)=>`<div><div class="week-day">周${d}</div><div class="week-dot ${wd[i]>=5?'done':wd[i]>=3?'empty':wd[i]>0?'miss':'empty'}">${wd[i]}</div><div style="font-size:10px;color:#8b8fa3">项</div></div>`).join('');
  const levels=[[3,2,4,5,2,1,0],[4,5,3,2,4,3,1],[2,3,5,4,3,2,4],[1,2,3,4,5,4,3]];
  let heat='';for(let wk=0;wk<4;wk++){heat+=`<div style="font-size:11px;color:#8b8fa3;margin-bottom:4px">第${wk+1}周</div><div class="heatmap-grid" style="margin-bottom:10px">`;for(let d=0;d<7;d++){let cls='';if(levels[wk][d]>=5)cls='l4';else if(levels[wk][d]>=4)cls='l3';else if(levels[wk][d]>=2)cls='l2';else if(levels[wk][d]>=1)cls='l1';heat+=`<div class="heatmap-cell ${cls}"></div>`;}heat+='</div>';}
  return `<div class="page-title">📊打卡统计</div><div class="page-subtitle">追踪学习进度，坚持就是胜利</div><div class="stats"><div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">总学习项</div></div><div class="stat-card green"><div class="stat-num">${done}</div><div class="stat-label">今日完成</div></div><div class="stat-card orange"><div class="stat-num">${rate}%</div><div class="stat-label">完成率</div></div></div><div class="chart-section"><div class="chart-title">📅本周打卡</div><div class="week-grid">${wHtml}</div></div><div class="chart-section"><div class="chart-title">🗓️本月热力图</div>${heat}</div>`;
}

// ====== 工具 ======
function closeModal(id){document.getElementById(id).classList.remove('show');if(id==='taskModal')document.getElementById('taskSubject').disabled=false;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getDateStr(){const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日·星期${['日','一','二','三','四','五','六'][d.getDay()]}`;}
